<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="Standard v16 — a calm, private operating system for study, health, routine and money">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Standard — v16</title>
<style>
:root{
  --bg:#FFFFFF;--surface:#F6F6F6;--surface2:#EDEDED;
  --ink:#0B0B0B;--muted:#626262;--faint:#737373;
  --line:#E8E8E8;--line2:#D2D2D2;--pad:16px;--max:560px;
  --sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
[data-theme="dark"]{
  --bg:#0B0B0B;--surface:#191919;--surface2:#242424;
  --ink:#F6F6F6;--muted:#B8B8B8;--faint:#969696;
  --line:#262626;--line2:#454545;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header,.page,nav{width:min(100%,var(--max));margin-inline:auto;background:var(--bg)}
.page{min-height:calc(100vh - 64px)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
svg.i{display:inline-block;vertical-align:middle;flex:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media (min-width:561px){header,.page,nav{border-inline:1px solid var(--line)}}
@media (max-width:430px){
  .daybar{display:grid!important;grid-template-columns:repeat(3,1fr)}
  .dbc:nth-child(3){border-right:none}.dbc:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .l3{margin-left:0;flex-wrap:wrap}.rirw{width:100%}.rirc{flex:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ================= HEADER ================= */
header{position:sticky;top:0;z-index:60;background:var(--bg)}
.mast{display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 10px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.datestr{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.spacer{flex:1}
.badge{font-family:var(--display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap}
.icbtn{width:44px;height:44px;border:1px solid var(--line2);border-radius:8px;background:none;
  display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.icbtn:active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icbtn.onink{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.daybar{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line2)}
.dbc{flex:1;padding:11px 2px 12px;text-align:center;border-right:1px solid var(--line);
  background:none;border-top:none;border-bottom:none;border-left:none;cursor:pointer;position:relative}
.dbc:last-child{border-right:none}
.dbc:active{background:var(--surface)}
.dbl{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.dbv{font-family:var(--display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  margin-top:2px;letter-spacing:-.01em}
.dbm{position:absolute;left:10%;right:10%;bottom:5px;height:3px;background:var(--surface2);
  border-radius:1.5px;overflow:hidden}
.dbm>i{display:block;height:100%;background:var(--ink)}
.dbm.over>i{background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 6px)}

/* hero */
.hero{display:flex;align-items:center;gap:12px;padding:14px var(--pad);border-bottom:1px solid var(--line)}
.hl{font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.hv{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.hs{font-family:var(--display);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.hx{text-align:right}
.hbtn{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--ink);color:var(--bg);border:none;border-radius:9px;height:44px;padding:0 15px;cursor:pointer}

.seg{display:flex;border-bottom:1px solid var(--line)}
.seg button{flex:1;background:none;border:none;color:var(--faint);cursor:pointer;
  font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  min-height:44px;padding:12px 6px;text-transform:uppercase;position:relative}
.seg button.on{color:var(--ink)}
.seg button.on::after{content:"";position:absolute;left:24%;right:24%;bottom:-1px;height:2px;background:var(--ink)}

/* ================= SECTIONS ================= */
.sec{border-bottom:1px solid var(--line);scroll-margin-top:calc(env(safe-area-inset-top) + 122px)}
.sh{display:flex;align-items:center;gap:10px;width:100%;height:56px;padding:0 var(--pad);cursor:pointer;
  user-select:none;position:relative;background:none;border:0;text-align:left}
.sh:active{background:var(--surface)}
.st{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
.sf{margin-left:auto;font-family:var(--display);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.sf small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.chev{color:var(--faint);transition:transform .16s}
.sec.open .chev{transform:rotate(90deg)}
.hmtr{position:absolute;left:var(--pad);right:var(--pad);bottom:0;height:2px;background:none}
.hmtr>i{display:block;height:100%;background:var(--ink);opacity:.9}
.sb{display:none;padding:6px var(--pad) 18px;animation:fade .18s ease}
.sec.open .sb{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}

/* ================= ROWS ================= */
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rm{flex:1;min-width:0}
.rt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:var(--muted);margin-top:2px}
.rr{display:flex;align-items:center;gap:8px;flex:none}
.done .rt,.done .mn{color:var(--faint);text-decoration:line-through}
.tme{font-family:var(--display);font-size:11px;font-variant-numeric:tabular-nums;color:var(--faint);white-space:nowrap}
.tme.due{color:var(--ink);font-weight:700;text-decoration:underline dotted}

.vr{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.vr:last-child{border-bottom:none}
.vl{flex:1;min-width:0}
.vlab{font-size:13.5px;font-weight:500}
.vsub{font-family:var(--display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-top:2px}
.vbig{font-family:var(--display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.vbig small{font-size:11px;color:var(--muted);font-weight:600}

.cb{width:44px;height:44px;flex:none;border:1.5px solid var(--line2);border-radius:7px;display:grid;
  place-items:center;cursor:pointer;background:none;color:transparent;padding:0;transition:.12s}
.cb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.xb{width:44px;height:44px;background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;display:grid;place-items:center}
.xb:active{color:var(--ink)}

/* ================= INPUT SUITE ================= */
.stp{display:inline-flex;align-items:stretch;border:1px solid var(--line2);border-radius:9px;
  overflow:hidden;height:44px;background:var(--surface);flex:none}
.stp button{width:44px;background:none;border:none;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;padding:0}
.stp button:first-child{border-right:1px solid var(--line)}
.stp button:last-child{border-left:1px solid var(--line)}
.stp button:active{background:var(--ink);color:var(--bg)}
.stp input{border:none;background:none;color:var(--ink);text-align:center;width:var(--w,4.6ch);
  font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;
  padding:0 2px;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input:focus{outline:none}

.tch{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line2);border-radius:8px;color:var(--ink);
  height:44px;width:70px;text-align:center;padding:0 4px}
.tch:focus{outline:none;border-color:var(--ink)}
.tch.w9{width:88px}.tch.w5{width:56px}.tch[type="date"]{width:132px}
.chipsel{font-family:var(--display);font-size:12.5px;font-weight:600;background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;color:var(--ink);height:44px;padding:0 30px 0 12px;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.chipsel:focus{outline:none;border-color:var(--ink)}

.lab{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);display:block;margin-bottom:5px}
.tx{font-family:var(--sans);font-size:14px;background:none;border:none;border-bottom:1px solid var(--line2);
  color:var(--ink);width:100%;min-width:0;flex:1 1 auto;padding:6px 0 7px;border-radius:0}
.tx:focus{outline:none;border-bottom:1.5px solid var(--ink)}
.tx::placeholder{color:var(--faint)}
.tx.mono{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}

.rirw{display:inline-flex;gap:5px;flex:none}
.rirc{width:44px;height:44px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);
  color:var(--muted);font-family:var(--display);font-size:13px;font-weight:600;cursor:pointer;padding:0}
.rirc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.qc{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.qc button{border:1px solid var(--line2);background:none;color:var(--muted);
  font-family:var(--display);font-size:11px;font-weight:600;min-height:44px;padding:0 14px;
  border-radius:8px;cursor:pointer}
.qc button:active,.qc button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.xadd{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:42px;
  border:1px solid var(--line);border-radius:9px;background:none;color:var(--muted);cursor:pointer;
  font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  margin-top:12px;min-height:44px}
.xadd:active{border-color:var(--ink);color:var(--ink)}
.xadd.act{border-color:var(--ink);color:var(--ink)}
.xform{display:none;padding:12px 0 2px}
.xform.open{display:block;animation:fade .16s ease}
.xform .fldrow{display:flex;gap:14px;margin-top:10px}
.xform .fldrow>div{flex:1;min-width:0}
.xform .fldrow>div.tight{flex:0 0 96px}
.xform textarea{width:100%;min-height:88px;background:var(--surface);border:1px solid var(--line2);
  border-radius:9px;color:var(--ink);font-family:var(--display);font-size:11px;padding:9px}
.xact{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.btn{font-family:var(--display);font-size:12px;font-weight:600;background:none;border:1px solid var(--line2);
  color:var(--ink);height:44px;padding:0 16px;border-radius:9px;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghosty{border-color:transparent;color:var(--muted)}

.mtr{height:2px;background:var(--surface2);overflow:hidden;margin-top:10px;border-radius:1px}
.mtr>i{display:block;height:100%;background:var(--ink)}
.mtr.over>i{background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 6px)}

.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.cell{background:var(--bg);padding:10px 9px;min-width:0}
.cl{font-family:var(--display);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.cvv{font-family:var(--display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  margin-top:3px;letter-spacing:-.02em;white-space:nowrap}

/* meals */
.meal{border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.mh{display:flex;align-items:center;gap:8px;min-height:50px;padding:4px 0;width:100%}
.mealmain{display:flex;align-items:center;gap:9px;min-width:0;flex:1;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}
.mn{font-size:14px;font-weight:500}
.mk{margin-left:auto;font-family:var(--display);font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.meal.open .mk{color:var(--ink)}
.mbody{display:none;padding:2px 0 12px;animation:fade .16s ease}
.meal.open .mbody{display:block}
.it{display:flex;align-items:center;gap:9px;min-height:38px;padding:2px 0 2px 12px;
  border-left:1.5px solid var(--line)}
.itn{flex:1;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itq{font-size:11px;color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.itportion{display:flex;align-items:center;gap:7px;padding:6px 0 6px 12px;border-left:1.5px solid var(--line)}
.off .itn::after{content:"off plan";font-family:var(--display);font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-left:7px}

/* workout */
.lift{padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:none}
.l1{display:flex;align-items:center;gap:10px}
.l2{margin:3px 0 0 34px;font-size:11px;color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums}
.l3{display:flex;align-items:center;gap:10px;margin:9px 0 0 34px}
.l3 .tx{flex:1}

/* review */
.rev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rev:last-child{border-bottom:none}
.dotm{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:2px;flex:none;margin-top:5px}
.dotm.on{background:var(--ink)}
.dotm.na{border-color:var(--line2)}
.rvt{font-size:13px;line-height:1.5}

/* empty state */
.emp{font-family:var(--display);font-size:11px;color:var(--faint);letter-spacing:.04em;
  padding:14px 0 4px;text-align:center}

/* ================= PLAN ================= */
.card{border-bottom:1px solid var(--line);padding:16px var(--pad) 18px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ct{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.cn{margin-left:auto;font-family:var(--display);font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--faint)}
.icbtn.sm{width:44px;height:44px;border-radius:7px}
.gh{font-family:var(--display);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:14px 0 3px}
.foot{font-family:var(--display);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--muted);text-align:right;padding-top:9px}
.hrow{display:flex;align-items:center;gap:14px;width:100%;padding:17px var(--pad);border-bottom:1px solid var(--line);
  background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;text-align:left}
.hrow:active{background:var(--surface)}
#hub .hrow>span:last-child{color:var(--faint)}
.hi{font-family:var(--display);font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.06em;width:20px}
.hn{display:block;font-family:var(--display);font-weight:600;font-size:15px}
.hd{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.dz{margin:26px var(--pad) 10px;border:1px dashed var(--line2);border-radius:11px;padding:14px 14px 16px}
.dzt{font-family:var(--display);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.dz .vr{min-height:48px}
.subhead{display:flex;align-items:center;gap:8px;padding:13px var(--pad);border-bottom:1px solid var(--line)}
.backb{background:none;border:none;color:var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;min-width:44px;min-height:44px}
.subtitle{font-family:var(--display);font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px var(--pad);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:none;color:var(--muted);font-family:var(--display);
  font-size:11px;font-weight:600;letter-spacing:.07em;height:44px;padding:0 13px;border-radius:8px;
  cursor:pointer;text-transform:uppercase}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dis{opacity:.35;pointer-events:none}

/* trend */
svg.chart{display:block;width:100%;overflow:visible}
.gl{stroke:var(--line)}.axlab{font-family:var(--display);font-size:8.5px;fill:var(--faint)}
.ln{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--ink);fill-opacity:.055}
[data-theme="dark"] .ar{fill-opacity:.16}
.dot{fill:var(--faint)}
.lastdot{fill:var(--ink)}
.bar{fill:var(--ink)}.barlite{fill:var(--line2)}
.stamp{display:inline-flex;font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.stamp.plan{border:1px solid var(--line2);color:var(--muted)}
.stamp.live{background:var(--ink);color:var(--bg)}
.stamp.warn{border:1px dashed var(--line2);color:var(--faint)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;overflow-wrap:anywhere}
.chartmeta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-family:var(--display);font-size:10px;color:var(--muted)}
.notice{margin:12px 0 4px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--muted);line-height:1.5}

/* v15 now and quick workflow */
.nowcard{padding:16px var(--pad);border-bottom:1px solid var(--line);background:var(--bg)}
.nowtop{display:flex;align-items:flex-start;gap:12px}.nowtitle{font-family:var(--display);font-size:20px;font-weight:650;letter-spacing:-.025em;margin-top:2px}
.nowmeta{font-family:var(--display);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.nowactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nowactions .btn{flex:1;min-width:110px}
.focusline{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.focusclock{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.quickbar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.quickbar button{min-width:0;min-height:54px;border:0;background:var(--bg);color:var(--muted);font-family:var(--display);font-size:9.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:8px 3px;cursor:pointer}
.quickbar button:active{background:var(--surface);color:var(--ink)}
.session{padding:10px 0;border-bottom:1px solid var(--line)}.session:last-child{border-bottom:none}
.sessionhead{display:flex;align-items:flex-start;gap:10px}.sessionmin{font-family:var(--display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sessionout{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.presetrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.presetrow button{min-height:44px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;color:var(--muted);font-family:var(--display);font-size:10px;font-weight:650;padding:0 10px;cursor:pointer}.presetrow button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chartwrap{position:relative}.charttip{position:fixed;z-index:100;display:none;pointer-events:none;max-width:220px;padding:8px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:11px;font-weight:650;box-shadow:0 6px 24px rgba(0,0,0,.22)}.charttip.on{display:block}
.chartpoint{cursor:pointer;outline:none;pointer-events:all;stroke:transparent;stroke-width:20;paint-order:stroke}.chartpoint:focus{stroke:var(--ink);stroke-width:3}
.charttable{margin-top:8px}.charttable summary{cursor:pointer;font-family:var(--display);font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.charttable table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}.charttable th,.charttable td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}.charttable th:last-child,.charttable td:last-child{text-align:right}
@media(max-width:380px){.quickbar{grid-template-columns:repeat(3,1fr)}.quickbar button:nth-child(n+4){border-top:1px solid var(--line)}.nowactions .btn{min-width:90px}}

/* v16 integrity and recovery */
.sysbanner{display:none;margin:10px var(--pad) 0;padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.5}
.sysbanner.on{display:block}.sysbanner strong{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.sysactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sysactions .btn{min-width:105px;flex:1}
.healthrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.healthrow:last-child{border-bottom:none}
.healthdot{width:9px;height:9px;border-radius:50%;background:var(--ink);flex:none}.healthdot.warn{background:transparent;border:2px solid var(--ink)}
.errbox{margin:16px;padding:16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.readonly{opacity:.65;pointer-events:none}

/* toast */
.toast{position:fixed;left:50%;right:auto;width:min(calc(100% - 24px),536px);transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:var(--bg);border-radius:11px;padding:12px 14px;display:none;
  align-items:center;gap:12px;font-family:var(--display);font-size:12.5px;font-weight:600;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.on{display:flex;animation:fade .16s ease}
.toast span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{background:none;border:none;color:var(--bg);font-family:var(--display);
  font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:2px 4px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg);border-top:1px solid var(--line2);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--faint);cursor:pointer;min-height:54px;padding:13px 0 14px;
  font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;position:relative}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;top:-1px;left:26%;right:26%;height:2px;background:var(--ink)}
.history-head{display:flex;align-items:center;gap:10px;padding:14px var(--pad);border-bottom:1px solid var(--line)}
.history-date{font-family:var(--display);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.history-grid .cell{background:var(--bg)}
details.hist{border-bottom:1px solid var(--line);padding:0 var(--pad)}
details.hist summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:58px;cursor:pointer}
details.hist summary::-webkit-details-marker{display:none}
.missing{color:var(--muted);font-style:italic}
.page{display:none}.page.on{display:block}
</style>
</head>

 const rx=parseRx(l[1]);
 if(!String(l[3]).trim())return{cls:'plan',s:esc(l[2]),tag:''};

 const toks=parseSets(l[3],rx);

 const chase=()=>prevStamp(l[0])==='CHASE'?{cls:'live',s:'DELOAD',tag:'DELOAD'}:{cls:'live',s:'CHASE',tag:'CHASE'};
 if(rx.t?toks.some(x=>x.v<rx.r):toks.some(x=>x.r!=null&&x.r<rx.r))return chase();
 if(l[4]==='')return{cls:'plan',s:'RIR',tag:''};

 if(rir>=2){const t=String(l[2]),add=rx.t?'TRY +15s':(/kg/i.test(t)?'TRY +2':'TRY REPS');return{cls:'live',s:add,tag:'TRY'}}

function tickMeal(mealId){const m=mealLogById(mealId);if(!m)return;m.d=!m.d;if(m.d&&!m.at)m.at=clk(S.now);render()}

function setMealPortion(mealId,itemId,qty){const log=mealLogById(mealId);if(!log||replacementEntry(log,itemId))return;setPortionQty(log,itemId,qty);log.d=true;render()}
function removeMealExtra(mealId,ii,evt){guardDelete(()=>{const log=mealLogById(mealId),item=normalizeExtra(log?.extras?.[ii]);if(!log||!item.n)return;const before=item.replaces?cloneJSON(replacementEntry(log,item.replaces)):null;log.extras.splice(ii,1);if(item.replaces){const r=replacementEntry(log,item.replaces);if(r){r.count=Math.max(0,r.count-1);if(!r.count){setPortionQty(log,item.replaces,r.original);log.replacements=log.replacements.filter(x=>x.itemId!==item.replaces)}}}UNDO={undo:()=>{log.extras.splice(ii,0,item);if(item.replaces){let r=replacementEntry(log,item.replaces);if(before){if(r)Object.assign(r,before);else log.replacements.push(cloneJSON(before))}else if(!r)log.replacements.push({itemId:item.replaces,original:portionQty(log,item.replaces),count:1});setPortionQty(log,item.replaces,0)}render()}};render();toast('Removed '+item.n,true)},'meal-extra:'+mealId+':'+ii,evt)}

    ${outputs.length?outputs.map(r=>`<div class="vr"><div class="vl"><div class="vlab">${esc(r.output)}</div><div class="vsub">${esc(r.project||'Study')} · ${r.minutes}′ · ${r.d}</div></div></div>`).join(''):'<div class="emp">No session outputs recorded</div>'}</div>`;
  bars($('c5'),sd,sp2,{max:Math.max(150,...sd.map(x=>x.v),...sp2.map(x=>x.v)),unit:'min',label:'Study minutes versus planned minutes'});
 }else if(curTrend==='money'){
  const wk=wAgg(rs);if(!wk.length){B.innerHTML=empCard('Money');return}
  const cats={};rs.forEach(r=>(r.spends||[]).forEach(s=>{cats[s[0]]=(cats[s[0]]||0)+s[1]}));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),ct=cl.reduce((a,c)=>a+c[1],0)||1;

  const knownPlans=wk.filter(x=>Number.isFinite(x.plan)).map(x=>({d:x.d,v:x.plan}));bars($('c6'),wk,knownPlans,{max:Math.max(...wk.map(x=>Math.max(x.v,Number.isFinite(x.plan)?x.plan:0)*1.2),1),unit:'₹',label:'Weekly spending versus allowance'});

  const item={};rs.filter(r=>!r.partial&&Array.isArray(r.routineOpp)).forEach(r=>{const opp=new Set(r.routineOpp),miss=new Set(r.missed||[]);opp.forEach(n=>{item[n]||(item[n]={miss:0,opp:0});item[n].opp++;if(miss.has(n))item[n].miss++})});const ml=Object.entries(item).filter(([,x])=>x.miss>0).sort((a,b)=>b[1].miss-a[1].miss||a[0].localeCompare(b[0])).slice(0,3);

function chartTip(evt,text){const t=$('charttip');if(!t)return;t.textContent=text;t.classList.add('on');t.setAttribute('aria-hidden','false');const x=Math.max(8,Math.min(innerWidth-230,(evt.clientX||innerWidth/2)+10)),y=Math.max(8,(evt.clientY||80)-42);t.style.left=x+'px';t.style.top=y+'px'}
function hideChartTip(){const t=$('charttip');if(t){t.classList.remove('on');t.setAttribute('aria-hidden','true')}}
function showChartPoint(e,n){chartTip(e?.clientX!=null?e:{clientX:innerWidth/2,clientY:n.getBoundingClientRect().top},n.dataset.tip)}
function bindChartPoints(el){el.querySelectorAll('.chartpoint').forEach(n=>{n.addEventListener('pointerenter',e=>showChartPoint(e,n));n.addEventListener('pointermove',e=>showChartPoint(e,n));n.addEventListener('pointerleave',hideChartTip);n.addEventListener('focus',e=>showChartPoint(e,n));n.addEventListener('blur',hideChartTip);n.addEventListener('click',e=>showChartPoint(e,n));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();showChartPoint(e,n)}})})}
function line(el,v,o={}){const w=340,h=132,pl=34,pr=8,pt=8,pb=28;
 if(v.length<2){el.innerHTML='<div class="emp">Not enough measured points</div>';return}
 const dated=isObj(v[0])&&'v' in v[0],vals=dated?v.map(x=>+x.v):v.map(Number);
 let mn=o.min??Math.min(...vals)-.3,mx=o.max??Math.max(...vals)+.3;if(mx===mn){mx+=1;mn-=1}
 let times=null,t0=0,t1=1;if(dated){times=v.map(x=>+new Date(x.d+'T12:00:00'));t0=Math.min(...times);t1=Math.max(...times);if(t1===t0)t1=t0+86400000}
 const X=i=>dated?pl+(times[i]-t0)/(t1-t0)*(w-pl-pr):pl+i*(w-pl-pr)/(vals.length-1),Y=x=>pt+(mx-x)/(mx-mn)*(h-pt-pb);
 let g='';for(let i=0;i<4;i++){const y=pt+i*(h-pt-pb)/3;g+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text class="axlab" x="0" y="${y+3}">${(mx-(mx-mn)*i/3).toFixed(o.dec??1)}</text>`}
 if(dated){const mid=v[Math.floor((v.length-1)/2)];g+=`<text class="axlab" x="${pl}" y="${h-4}">${v[0].d.slice(5)}</text><text class="axlab" text-anchor="middle" x="${w/2}" y="${h-4}">${mid.d.slice(5)}</text><text class="axlab" text-anchor="end" x="${w-pr}" y="${h-4}">${v[v.length-1].d.slice(5)}</text>`}
 const pts=vals.map((x,i)=>`${X(i).toFixed(1)},${Y(x).toFixed(1)}`),d2='M'+pts.join(' L'),area=d2+` L${X(vals.length-1).toFixed(1)},${h-pb} L${X(0).toFixed(1)},${h-pb} Z`;
 const circles=vals.map((x,i)=>{const label=(dated?v[i].d+(v[i].partial?' partial':'')+' · ':'')+x+(o.unit?' '+o.unit:'');return `<circle class="${i===vals.length-1?'lastdot':'dot'} chartpoint" tabindex="0" role="button" aria-label="${esc(label)}" cx="${X(i).toFixed(1)}" cy="${Y(x).toFixed(1)}" r="${i===vals.length-1?3.4:3}" data-tip="${esc(label)}"/>`}).join('');
 const rows=(dated?v.map((x,i)=>[x.d+(x.partial?' (partial)':''),vals[i]]):vals.map((x,i)=>[String(i+1),x]));
 el.innerHTML=`<div class="chartwrap"><svg class="chart" role="img" aria-label="${esc(o.label||'Line chart')}" viewBox="0 0 ${w} ${h}"><path class="ar" d="${area}"/>${g}<path class="ln" d="${d2}"/>${circles}</svg></div><details class="charttable"><summary>View values</summary><table><thead><tr><th>${dated?'Date':'Point'}</th><th>Value</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}${o.unit?' '+o.unit:''}</td></tr>`).join('')}</tbody></table></details>`;
 bindChartPoints(el)
}
function bars(el,v,p,o={}){const w=340,h=132,pl=34,pr=8,pt=8,pb=28;
 if(!v.length){el.innerHTML='<div class="emp">No completed-day data</div>';return}
 const dated=isObj(v[0])&&'v' in v[0],vals=dated?v.map(x=>+x.v):v.map(Number);let pvals=null;
 if(p){if(dated&&isObj(p[0])&&'v' in p[0]){const pm=new Map(p.map(x=>[x.d,+x.v]));pvals=v.map(x=>pm.has(x.d)&&Number.isFinite(pm.get(x.d))?pm.get(x.d):null)}else pvals=p.map(x=>Number.isFinite(+x)?+x:null)}
 const finitePlans=(pvals||[]).filter(Number.isFinite),mx=Math.max(1,o.max??Math.max(...vals,...finitePlans,0)*1.1);let times=null,t0=0,t1=1;
 if(dated){times=v.map(x=>+new Date(x.d+'T12:00:00'));t0=Math.min(...times);t1=Math.max(...times);if(t1===t0)t1=t0+86400000}
 const spanUnits=dated?Math.max(1,(t1-t0)/86400000):vals.length-1,bw=Math.max(3,Math.min(22,(w-pl-pr)/(spanUnits+1)*.65));
 const X=i=>dated?(vals.length===1?(pl+w-pr)/2-bw/2:pl+(times[i]-t0)/(t1-t0)*(w-pl-pr)-bw/2):pl+i*(w-pl-pr)/Math.max(1,vals.length)-bw/2+(w-pl-pr)/Math.max(1,vals.length)/2;
 let g='';for(let i=0;i<3;i++){const y=pt+i*(h-pt-pb)/2;g+=`<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text class="axlab" x="0" y="${y+3}">${Math.round(mx-mx*i/2)}</text>`}
 if(dated){const mid=v[Math.floor((v.length-1)/2)];g+=`<text class="axlab" x="${pl}" y="${h-4}">${v[0].d.slice(5)}</text><text class="axlab" text-anchor="middle" x="${w/2}" y="${h-4}">${mid.d.slice(5)}</text><text class="axlab" text-anchor="end" x="${w-pr}" y="${h-4}">${v[v.length-1].d.slice(5)}</text>`}
 let b='';vals.forEach((x,i)=>{const bx=X(i),plan=pvals?pvals[i]:null;if(Number.isFinite(plan)){const py=pt+(1-Math.min(1,plan/mx))*(h-pt-pb);b+=`<rect class="barlite" x="${bx}" y="${py}" width="${bw}" height="${Math.max(0,h-pb-py)}"/>`}const y=pt+(1-Math.min(1,x/mx))*(h-pt-pb),label=`${dated?v[i].d+(v[i].partial?' partial':''):'Point '+(i+1)} · ${x}${o.unit?' '+o.unit:''}${Number.isFinite(plan)?` · plan ${plan}`:''}`;b+=`<rect class="bar chartpoint" tabindex="0" role="button" aria-label="${esc(label)}" data-tip="${esc(label)}" x="${bx+bw*.2}" y="${y}" width="${bw*.6}" height="${Math.max(0,h-pb-y)}"/>`});
 const rows=vals.map((x,i)=>[dated?v[i].d+(v[i].partial?' (partial)':''):String(i+1),x,pvals?pvals[i]:null]);
 el.innerHTML=`<div class="chartwrap"><svg class="chart" role="img" aria-label="${esc(o.label||'Bar chart')}" viewBox="0 0 ${w} ${h}">${g}${b}</svg></div><details class="charttable"><summary>View values</summary><table><thead><tr><th>${dated?'Date':'Point'}</th><th>Actual${pvals?' / plan':''}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}${pvals&&Number.isFinite(r[2])?' / '+r[2]:''}${o.unit?' '+o.unit:''}</td></tr>`).join('')}</tbody></table></details>`;
 bindChartPoints(el)
}


/* ---------- history ---------- */
function editHistory(date,key,el){const r=S.hist.find(x=>x.d===date);if(!r||r.missing)return;const study=['sa','sb','sx'].includes(key),raw=String(el.value??'').trim();if(!study&&!raw){r[key]=null;if(key==='ke')r.def=null;save();rHistory();return}const limits={wt:[20,500,1],waist:[10,100,1],ke:[0,10000,0],pe:[0,1000,1],steps:[0,500000,0],sa:[0,1440,0],sb:[0,1440,0],sx:[0,1440,0]},cfg=limits[key]||[0,1e9,0],fallback=study?historyStudyTotals(r)[{sa:'A',sb:'B',sx:'Extra'}[key]]:(r[key]??0),v=normaliseNumber(raw,{min:cfg[0],max:cfg[1],dec:cfg[2],fallback});if(!v.ok){el.value=fallback;toast('History value was not changed');return}el.value=v.value;if(v.changed)toast('History value was normalised to '+v.value);if(study)setHistoryBlockTotal(r,{sa:'A',sb:'B',sx:'Extra'}[key],v.value);else r[key]=v.value;if(key==='ke'&&Number.isFinite(r.burn))r.def=r.burn-r.ke;if(key==='wt')r.refWt=r.wt;save();rHistory()}
function removeHistory(date,evt){guardDelete(()=>{const i=S.hist.findIndex(r=>r.d===date);if(i<0)return;const record=S.hist[i],trashItem={record:cloneJSON(record),deletedAt:Date.now()};S.hist.splice(i,1);S.trash.history.push(trashItem);const ok=persistNow(false);if(!ok){const j=S.trash.history.findIndex(x=>x.deletedAt===trashItem.deletedAt&&x.record?.d===record.d);if(j>=0)S.trash.history.splice(j,1);upsertHistory(record);UNDO=null;rHistory();toast('History record was not removed');return}UNDO={undo:()=>{const j=S.trash.history.findIndex(x=>x.record.d===record.d);if(j>=0)S.trash.history.splice(j,1);upsertHistory(record);render();rHistory()}};rHistory();toast('Moved '+date+' to History trash',true)},'history:'+date,evt)}
function rHistory(){
 const B=$('historybody');if(!B)return;const hs=$('historySave');if(hs)hs.textContent=S.closedToday?'Update today':'Save today';const rs=[...S.hist].sort((a,b)=>b.d.localeCompare(a.d));
 if(!rs.length){B.innerHTML='<div class="card"><div class="emp">No archived days yet. Save today or let midnight archive it automatically.</div></div>';return}
 B.innerHTML=rs.map(r=>{
  if(r.missing)return `<details class="hist"><summary><span class="history-date">${r.d}</span><span class="spacer"></span><span class="missing">No record</span></summary><div class="notice">The app was not used for this date, so Standard leaves it missing rather than creating zeroes.</div></details>`;
  const st=historyStudyTotals(r),study=st.A+st.B+st.Extra,spent=(r.spends||[]).reduce((a,x)=>a+(+x[1]||0),0);
  const inp=(lab,key,val,step=1)=>`<div class="vr"><div class="vl"><label class="vlab" for="h-${r.d}-${key}">${lab}</label></div><input id="h-${r.d}-${key}" class="tch w9" type="number" min="0" step="${step}" value="${val??''}" onchange="editHistory('${r.d}','${key}',this)"></div>`;
  return `<details class="hist"><summary><span class="history-date">${r.d}</span><span class="rm"><div class="vlab">${r.ty==='uni'?'University':'Home'} day${r.partial?' · partial':''}</div><div class="vsub">${showK(r.ke)} kcal · ${(r.steps||0).toLocaleString()} steps · ${study}′ study</div></span>${I.chev}</summary>
   <div class="history-grid"><div class="cell"><div class="cl">Weight</div><div class="cvv">${r.wt??'—'}</div></div><div class="cell"><div class="cl">Protein</div><div class="cvv">${showP(r.pe)}g</div></div><div class="cell"><div class="cl">Spent</div><div class="cvv">${inr(spent)}</div></div></div>
   ${(r.sessions||[]).length?`<div class="notice"><b>Study sessions</b><br>${r.sessions.map(x=>`${esc(x.block)} · ${esc(x.project)} · ${x.minutes}′${x.output?' · '+esc(x.output):''}`).join('<br>')}</div>`:(r.studyOutput?`<div class="notice"><b>${esc(r.project||'Study')}</b><br>${esc(r.studyOutput)}</div>`:'')}
   ${inp('Weight kg','wt',r.wt,.1)}${inp('Waist inches','waist',r.waist,.1)}${inp('Calories logged','ke',r.ke)}${inp('Protein g','pe',r.pe,.1)}${inp('Steps','steps',r.steps)}${inp('Block A minutes','sa',st.A)}${inp('Block B minutes','sb',st.B)}${inp('Extra study minutes','sx',st.Extra)}
   <div class="xact" style="padding-bottom:16px"><button class="btn ghosty" onclick="if(confirm('Remove ${r.d} from History?'))removeHistory('${r.d}',event)">Remove record</button></div></details>`
 }).join('')
}

/* ---------- boot ---------- */
function refreshFocusUI(){if(!S.focus.active)return;const m=focusMinutes();document.querySelectorAll('.focusclock').forEach(x=>x.textContent=m+'′');const st=document.querySelector('#hero .stamp.live');if(st)st.textContent=m+'′';const meta=document.querySelector('#hero .nowmeta');if(meta)meta.textContent=S.focus.block+' · '+m+' minutes elapsed'}
function syncClock(){const d=new Date(),wall=Date.now(),mono=monoNow();clockDriftMs=Number.isFinite(clockMonoAt)?(wall-clockWallAt)-(mono-clockMonoAt):0;clockWallAt=wall;clockMonoAt=mono;S.now=d.getHours()*60+d.getMinutes();$('datestr').textContent=WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]}
function applyExternalSilently(d){if(hasDirtyEditors()){externalEnvelope=d;setSaveStatus('conflict');rSystemBanner();return false}try{applyPayload(d.payload,'other tab',d.schema);S.sys.revision=Math.max(S.sys.revision,d.revision);baseVersion=versionOf(d);externalEnvelope=null;dirty=false;suppressNextSave=true;bootNotice='Synced a newer verified change from another tab.';render();rRng();rTrend();rHistory();setSaveStatus('synced');return true}catch(e){externalEnvelope=d;setSaveStatus('conflict');rSystemBanner();return false}}
async function bootStandard(){await claimInstance();if(instanceWritable)migrateCheckpointSlots();const hadSave=loadS();syncClock();if(instanceWritable)rollover();if(!hadSave&&instanceWritable)smartOpen();
 $('tbtn').innerHTML=I.moon;setSaveStatus(instanceWritable?(hadSave?'verified':'v16'):'read-only');
 try{const pref=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(pref==='dark'){document.body.dataset.theme='dark';$('tbtn').innerHTML=I.sun}}catch(e){}
 document.querySelectorAll('#hub .hrow span[id^=hc]').forEach(s=>s.innerHTML=I.right);
 render();rRng();rTrend();rHistory();rSystemBanner();
 if(instanceWritable)try{if(!latestCheckpoint()||Date.now()-(latestCheckpoint()?.data.updatedAt||0)>21600000)createCheckpoint('Automatic checkpoint',true)}catch(_){}
}
addEventListener('pagehide',()=>{if(instanceWritable){persistNow(false);releaseInstanceOwnership()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&instanceWritable)persistNow(false)});
document.addEventListener('input',e=>{if(editorKey(e.target))markEditorDirty(e.target)});
document.addEventListener('change',e=>{if(editorKey(e.target))markEditorDirty(e.target)});
addEventListener('storage',e=>{if(e.key===TAKEOVER_KEY){if(instanceWritable){let x=null;try{x=e.newValue&&JSON.parse(e.newValue)}catch(_){}if(isObj(x)&&x.writer&&x.writer!==INSTANCE){persistNow(false);releaseInstanceOwnership('Another Standard tab took over. This tab is read-only.');render()}}return}if(e.key===INSTANCE_KEY){const x=readInstanceHeartbeat();if(instanceWritable&&x&&x.writer!==INSTANCE){persistNow(false);releaseInstanceOwnership('Another Standard tab took over. This tab is read-only.');render()}return}if(e.key!==KEY||!e.newValue)return;const d=decodeStored(e.newValue);if(d.future){writeBlocked=true;bootNotice=d.error+'. Standard v16 will not overwrite this data.';setSaveStatus('newer data');rSystemBanner();return}if(!d.valid||d.writer===INSTANCE||compareVersion(d,baseVersion)<=0)return;if(!dirty&&!S.focus.active&&!hasDirtyEditors())applyExternalSilently(d);else{externalEnvelope=d;setSaveStatus('conflict');rSystemBanner()}});
addEventListener('error',e=>{S.sys.lastError=String(e.error?.stack||e.message||'Unknown error');setSaveStatus('error');try{if(instanceWritable)persistNow(false)}catch(_){}});
addEventListener('unhandledrejection',e=>{S.sys.lastError=String(e.reason?.stack||e.reason||'Unhandled promise rejection');setSaveStatus('error');try{if(instanceWritable)persistNow(false)}catch(_){}});
setInterval(()=>{syncClock();if(instanceWritable&&isoLocal(new Date())!==S.date){rollover();render()}else{if(S.focus.active)refreshFocusUI();else rHero();rBar();rSystemBanner()}if(instanceWritable&&Date.now()-(S.sys.lastCheckpointAt||0)>21600000)createCheckpoint('Automatic checkpoint',true)},30000);
bootStandard();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
